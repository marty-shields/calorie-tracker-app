# The .NET SDK in global.json and the maui-android workload set that matches it, for every job that builds the App or the
# stories. This is the only place the workload set is pinned: bump it with the SDK in global.json
# (`dotnet workload search version`). It also decides the WebAssembly SDK pack the stories host's lock file (src/CalorieTracker.UI.Stories.Host/packages.lock.json) records, so a job
# without it fails the locked restore. e2e-local.sh reads the pin from here.
name: Set up .NET for MAUI Android
description: Installs the .NET SDK in global.json and the pinned maui-android workload set.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json

    - name: Check the workload set matches the SDK's feature band
      shell: bash
      run: '"$GITHUB_ACTION_PATH"/../../scripts/check-maui-pin.sh'

    - name: Install the MAUI Android workload
      shell: bash
      run: dotnet workload install maui-android --version 11.0.100.1
