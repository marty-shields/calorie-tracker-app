# Releases main by hand (Actions > Release > Run workflow): works out the next version from the semver labels of the PRs
# merged since the last v* tag, builds and tests, runs the E2E suite on emulators (qa-pipeline.yml, release-e2e.yml and
# upgrade-e2e.yml), then, after the owner approves the release environment, builds the signed APK and publishes the GitHub
# release with its v* tag (docs/release.md).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The release signing cert's SHA-256, as 32 colon-separated hex bytes. TODO: placeholder until the CalorieTracker release
  # keystore exists (docs/release.md); the "Release cert pinned" step fails the release while it is not a real digest.
  CERT_SHA256: 'UNSET-release-keystore-not-yet-configured'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      code: ${{ steps.next.outputs.code }}
    steps:
      - name: Main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Release::Releases run from main only, not $GITHUB_REF."
          exit 1

      - name: Release cert pinned
        run: |
          if ! grep -Eqx '([0-9A-F]{2}:){31}[0-9A-F]{2}' <<<"$CERT_SHA256"; then
            echo "::error title=Release::release signing keystore not yet configured - see the tracking issue. CERT_SHA256 in release.yml is a placeholder; set it to the release cert's SHA-256 (docs/release.md)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/next-version.sh v "$GITHUB_SHA"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/dev-pipeline.yml

  e2e:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/qa-pipeline.yml

  # A Release build of the same commit on emulators: it starts cleanly and the @release and @backup scenarios run on it, and
  # it installs over the last release's Release build in the upgrade check.
  release-e2e:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/release-e2e.yml

  # The last release's Debug build, then this commit's installed over it: the upgrade check.
  upgrade-e2e:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/upgrade-e2e.yml

  # Waits for the owner's approval of the release environment, which holds the signing secrets.
  release:
    needs: [version, build, e2e, release-e2e, upgrade-e2e]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maui

      # Packages are downloaded before any secret is on the runner.
      - name: Restore
        run: dotnet restore src/CalorieTracker.App -p:Configuration=Release

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: base64 -d <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"

      # Passwords reach MSBuild through env: and never appear on the command line.
      - name: Build the signed Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          dotnet publish src/CalorieTracker.App -c Release -f net11.0-android -p:AndroidPackageFormat=apk \
            -r android-arm64 --no-restore \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$CODE" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$RELEASE_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:RELEASE_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:RELEASE_KEYSTORE_PASSWORD \
            -o "$RUNNER_TEMP/release"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK
        run: .github/scripts/check-apk.sh "$RUNNER_TEMP/release/uk.martinshields.calorietracker-Signed.apk" "$VERSION" "$CODE" "$CERT_SHA256" "$RUNNER_TEMP/out"

      - name: Check the backup rules
        run: .github/scripts/check-backup.sh "$RUNNER_TEMP/release/uk.martinshields.calorietracker-Signed.apk" true backup_rules

      # Creates the v* tag on this commit with the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/out/CalorieTracker-$VERSION.apk"
          gh release create "v$VERSION" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" \
            --generate-notes --notes "$(cat "$RUNNER_TEMP/out/notes.md")"
